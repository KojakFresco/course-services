openapi: 3.0.3
info:
  title: Course Service API
  description: Course Service API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
    description: Development Server

tags:
  - name: Courses
    description: Управление курсами
  - name: Assignments
    description: Управление заданиями
  - name: Submissions
    description: Отправка и просмотр решений
  - name: Reviews
    description: Проверка решений

paths:
  # =========================================================================
  # 1. COURSES
  # =========================================================================
  /api/v1/courses:
    get:
      tags: [Courses]
      summary: Получить список курсов
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список курсов успешно получен
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Courses]
      summary: Создать новый курс
      description: Доступно только администратору
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Курс успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/courses/{id}:
    get:
      tags: [Courses]
      summary: Получить курс по ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Данные курса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Courses]
      summary: Частично обновить курс
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
      responses:
        '200':
          description: Курс обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Courses]
      summary: Удалить курс
      description: Доступно только администратору
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Курс успешно удален
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================================================================
  # 2. ASSIGNMENTS
  # =========================================================================
  /api/v1/assignments:
    get:
      tags: [Assignments]
      summary: Получить список заданий
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список заданий
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Assignments]
      summary: Создать новое задание
      description: Доступно администратору и преподавателю
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        '201':
          description: Задание создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/assignments/{id}:
    get:
      tags: [Assignments]
      summary: Получить задание по ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Данные задания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Assignments]
      summary: Частично обновить задание
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentUpdate'
      responses:
        '200':
          description: Задание обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Assignments]
      summary: Удалить задание
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Задание удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================================================================
  # 3. SUBMISSIONS & ARTIFACTS
  # =========================================================================
  /api/v1/submissions:
    post:
      tags: [Submissions]
      summary: Отправить решение на проверку (Студент)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
      responses:
        '201':
          description: Решение принято на проверку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Превышен лимит попыток (attempts_limit)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/submissions/{id}:
    get:
      tags: [Submissions]
      summary: Получить информацию о решении по ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Данные решения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/submissions/{id}/artifacts:
    get:
      tags: [Submissions]
      summary: Получить артефакты решения
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Список артефактов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================================================================
  # 4. REVIEWS
  # =========================================================================
  /api/v1/submissions/{id}/review:
    get:
      tags: [Reviews]
      summary: Получить отзыв/результат проверки для конкретного решения
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Reviews]
      summary: Создать отзыв/оценку к решению
      description: Преподаватель или Автотест
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '201':
          description: Отзыв успешно сохранен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Reviews]
      summary: Изменить существующий отзыв/оценку
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdate'
      responses:
        '200':
          description: Отзыв обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Передайте JWT-токен в формате 'Bearer <token>'. Роли определяются внутри токена.

  parameters:
    Limit:
      name: limit
      in: query
      description: Количество возвращаемых элементов
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Offset:
      name: offset
      in: query
      description: Смещение от начала списка
      schema:
        type: integer
        minimum: 0
        default: 0
    PathId:
      name: id
      in: path
      required: true
      description: Уникальный идентификатор ресурса (UUID)
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ идемпотентности для предотвращения дублирования запросов
      schema:
        type: string
        format: uuid

  schemas:
    # --- Course ---
    CourseCreate:
      type: object
      required: [ title, description, teacher_id, status ]
      properties:
        title:
          type: string
          minLength: 15
          maxLength: 255
          example: "Backend-разработка на Python"
        description:
          type: string
          minLength: 32
          maxLength: 4056
          example: "Полный курс по разработке серверных приложений и проектированию REST API."
        teacher_id:
          type: string
          format: uuid
          description: Идентификатор назначенного преподавателя (1 курс = 1 преподаватель)
          example: "11111111-1111-1111-1111-111111111111"
        status:
          type: string
          enum: [ ACTIVE, CLOSED, DRAFT ]
          example: "ACTIVE"

    CourseUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 15
          maxLength: 255
          example: "Продвинутый Backend на Python"
        description:
          type: string
          minLength: 32
          maxLength: 4056
          example: "Углубленный курс по асинхронному программированию и оптимизации БД."
        teacher_id:
          type: string
          format: uuid
          example: "22222222-2222-2222-2222-222222222222"
        status:
          type: string
          enum: [ ACTIVE, CLOSED, DRAFT ]
          example: "CLOSED"

    Course:
      allOf:
        - $ref: '#/components/schemas/CourseCreate'
        - type: object
          required: [ id, created_at, updated_at ]
          properties:
            id:
              type: string
              format: uuid
              example: "00000000-0000-0000-0000-000000000000"
            created_at:
              type: string
              format: date-time
              example: "2026-09-01T00:00:00Z"
            updated_at:
              type: string
              format: date-time
              example: "2026-09-05T14:30:00Z"

    # --- Assignment ---
    AssignmentCreate:
      type: object
      required: [ title, description, course_id, attempts_limit, date_start, date_end ]
      properties:
        title:
          type: string
          example: "Лабораторная работа №2 по REST API"
        description:
          type: string
          example: "Разработать и задокументировать контракты в формате OpenAPI"
        course_id:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000000"
        attempts_limit:
          type: integer
          minimum: 3
          maximum: 10
          description: Ограничение количества попыток сдачи (от 3 до 10)
          example: 3
        date_start:
          type: string
          format: date
          description: Дата начала выполнения задания
          example: "2026-10-01"
        date_end:
          type: string
          format: date
          description: Дедлайн сдачи задания
          example: "2026-10-20"
        materials_url:
          type: string
          format: uri
          description: Ссылка на методические материалы
          example: "https://university.com/materials/lab2.pdf"

    AssignmentUpdate:
      type: object
      properties:
        title:
          type: string
          example: "Лабораторная работа №2 (обновленная)"
        description:
          type: string
          example: "Добавлены требования к покрытию тестами"
        attempts_limit:
          type: integer
          minimum: 3
          maximum: 10
          example: 5
        date_start:
          type: string
          format: date
          example: "2026-10-02"
        date_end:
          type: string
          format: date
          example: "2026-10-25"
        materials_url:
          type: string
          format: uri
          example: "https://university.com/materials/lab2_v2.pdf"

    Assignment:
      allOf:
        - $ref: '#/components/schemas/AssignmentCreate'
        - type: object
          required: [ id, created_at, updated_at ]
          properties:
            id:
              type: string
              format: uuid
              example: "55555555-5555-5555-5555-555555555555"
            created_at:
              type: string
              format: date-time
              example: "2026-09-01T00:00:00Z"
            updated_at:
              type: string
              format: date-time
              example: "2026-09-01T12:30:00Z"

    # --- Submission ---
    SubmissionCreate:
      type: object
      required: [ assignment_id, repository_url ]
      properties:
        assignment_id:
          type: string
          format: uuid
          example: "55555555-5555-5555-5555-555555555555"
        repository_url:
          type: string
          format: uri
          example: "https://github.com/student/lab2-solution"

    Submission:
      type: object
      required: [ id, assignment_id, submitted_at, repository_url, status ]
      properties:
        id:
          type: string
          format: uuid
          example: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
        assignment_id:
          type: string
          format: uuid
          example: "55555555-5555-5555-5555-555555555555"
        submitted_at:
          type: string
          format: date-time
          example: "2026-10-15T18:24:01Z"
        review_id:
          type: string
          format: uuid
          description: ID связанной проверки (заполняется после ревью преподавателем)
          example: "cccccccc-cccc-cccc-cccc-cccccccccccc"
        auto_review_id:
          type: string
          format: uuid
          description: ID автоматической проверки (если запускались тесты)
          example: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
        repository_url:
          type: string
          format: uri
          example: "https://github.com/student/lab2-solution"
        status:
          type: string
          enum: [ SUBMITTED, PROCESSING, COMPLETED, FAILED ]
          example: "SUBMITTED"
        artifacts_url:
          type: string
          format: uri
          description: Ссылка на артефакты решения
          example: "https://storage.university.com/artifacts/lab2/student1.zip"

    Artifact:
      type: object
      required: [ artifacts_url ]
      properties:
        artifacts_url:
          type: string
          format: uri
          example: "https://storage.university.com/artifacts/lab2/student1.zip"

    # --- Review ---
    ReviewCreate:
      type: object
      required: [ type, feedback, mark, status ]
      properties:
        type:
          type: string
          enum: [ auto, manual ]
          description: Способ проверки
          example: "manual"
        feedback:
          type: string
          example: "Отличная архитектура, но не хватает обработки ошибок 409."
        mark:
          type: number
          format: float
          minimum: 0.0
          maximum: 10.0
          example: 9.5
        status:
          type: string
          enum: [ PASSED, FAILED ]
          example: "PASSED"

    ReviewUpdate:
      type: object
      properties:
        feedback:
          type: string
          example: "Исправлено: обработка 409 добавлена, оценка повышена."
        mark:
          type: number
          format: float
          minimum: 0.0
          maximum: 10.0
          example: 10.0
        status:
          type: string
          enum: [ PASSED, FAILED ]
          example: "PASSED"

    Review:
      allOf:
        - $ref: '#/components/schemas/ReviewCreate'
        - type: object
          required: [ id, created_at, updated_at ]
          properties:
            id:
              type: string
              format: uuid
              example: "cccccccc-cccc-cccc-cccc-cccccccccccc"
            created_at:
              type: string
              format: date-time
              example: "2026-10-16T10:00:00Z"
            updated_at:
              type: string
              format: date-time
              example: "2026-10-16T10:15:00Z"

    # --- Вспомогательные ---
    Pagination:
      type: object
      required: [ offset, limit, total ]
      properties:
        offset:
          type: integer
          example: 0
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42

    ErrorDetails:
      type: object
      required: [ code, message, status, path, request_id ]
      properties:
        code:
          type: string
          example: "COURSE_NOT_FOUND"
        message:
          type: string
          example: "Курс не существует"
        status:
          type: integer
          example: 404
        path:
          type: string
          example: "/api/v1/courses/00000000-0000-0000-0000-000000000000"
        request_id:
          type: string
          format: uuid
          example: "88888888-8888-8888-8888-888888888888"

    ErrorResponse:
      type: object
      required: [ error ]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetails'

  responses:
    Unauthorized:
      description: Ошибка авторизации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "TOKEN_MISSING"
              message: "Токен отсутствует"
              status: 401
              path: "/api/v1/courses"
              request_id: "00000000-0000-0000-0000-000000000000"
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "RESOURCE_NOT_FOUND"
              message: "Запрашиваемый объект не найден"
              status: 404
              path: "/api/v1/courses/00000000-0000-0000-0000-000000000000"
              request_id: "00000000-0000-0000-0000-000000000000"
    BadRequest:
      description: Некорректный запрос (ошибка валидации)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Поле title должно быть не менее 15 символов"
              status: 400
              path: "/api/v1/courses"
              request_id: "99999999-9999-9999-9999-999999999999"
    Forbidden:
      description: Доступ запрещен (недостаточно прав)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "ACCESS_DENIED"
              message: "У вас нет прав на это действие"
              status: 403
              path: "/api/v1/courses"
              request_id: "77777777-7777-7777-7777-777777777777"
